apiVersion: batch/v1
kind: Job
metadata:
  name: post-sync-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: smoke-test
        image: curlimages/curl:latest
        # command: ["curl", "-f", "http://frontend-service:80"]
        command: ["/bin/sh", "-c", "sleep 10 && curl -i http://frontend-service:80/"]
      restartPolicy: Never
  backoffLimit: 1
