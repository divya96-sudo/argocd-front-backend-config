apiVersion: batch/v1
kind: Job
metadata:
  name: post-sync-smoke-test
  namespace: app-ns
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  template:
    spec:
      serviceAccountName: default # Ensure this SA has permission to get/watch deployments
      containers:
      - name: smoke-test
        image: bitnami/kubectl:latest
        # Safely waits up to 60 seconds for the frontend pod to become available
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for frontend deployment to be ready..."
          kubectl rollout status deployment/frontend-deploy -n app-ns --timeout=60s
      restartPolicy: Never
  backoffLimit: 0 # Set to 0 so it fails immediately instead of retrying blindly
