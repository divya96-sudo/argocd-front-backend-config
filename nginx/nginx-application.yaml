apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/divya96-sudo/argocd-front-backend-config.git
    targetRevision: HEAD
    path: nginx
    # directory:
    #  recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ns
  syncPolicy:
    automated:  
      prune: true
      selfHeal: true