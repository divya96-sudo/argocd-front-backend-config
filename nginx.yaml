apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: test-project
  source:
    repoURL: https://github.com/divya96-sudo/argocd-front-backend-config.git
    targetRevision: HEAD
    path: frontend-config/nginx.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ns
  syncPolicy:
    automated:  
      prune: true
      selfHeal: true

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3 # Number of pod instances to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Namespace
metadata:
  name: nginx-ns
  labels:
    environment: testing